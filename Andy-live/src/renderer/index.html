<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy Live - Teleprompter HUD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="hud-container">
        <!-- Header Bar -->
        <header class="hud-header">
            <div class="brand">
                <span class="status-dot online"></span>
                <span class="title">Andy Live HUD</span>
                <span id="activeRoleBadge" class="badge">Default Profile</span>
                <span class="badge fast-badge">⚡ Fast Interview</span>
            </div>
            <div class="actions">
                <button id="debugBtn" class="btn-sm hidden" type="button">🛠️ Generate debug prompt</button>
                <button id="deepPromptBtn" class="btn-sm hidden" type="button">🧠 Deep prompt</button>
                <button id="practiceBtn" class="btn-sm" type="button" aria-pressed="false">Practice</button>
                <button id="historyBtn" class="btn-sm">📝 History</button>
                <button id="setupBtn" class="btn-sm">⚙️ Setup JD</button>
            </div>
        </header>

        <!-- Setup Modal -->
        <div id="setupModal" class="modal">
            <div class="modal-content">
                <h2>Interview Setup</h2>
                <label for="jdInput">Paste Target Job Description (JD):</label>
                <textarea id="jdInput" placeholder="Paste company requirements, stack, responsibilities here..."></textarea>
                
                <label for="resumeSelect">Target Resume:</label>
                <select id="resumeSelect">
                    <option value="">Auto-Detect Best Match</option>
                </select>

                <div class="modal-actions">
                    <button id="skipSetupBtn" class="btn-sm" type="button">Skip setup</button>
                    <button id="saveSetupBtn" class="btn-primary">Initialize AI Teleprompter</button>
                </div>
            </div>
        </div>

        <div id="historyModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
            <div class="modal-content history-modal-content">
                <div class="history-header">
                    <h2 id="historyTitle">Session History</h2>
                    <button id="closeHistoryBtn" class="icon-button" type="button" aria-label="Close session history">×</button>
                </div>
                <p id="historyEmpty" class="placeholder-text">Questions and responses from this app session will appear here.</p>
                <div id="historyList" class="history-list"></div>
                <div class="modal-actions history-actions">
                    <button id="clearHistoryBtn" class="btn-sm" type="button">Clear</button>
                    <button id="copyHistoryBtn" class="btn-sm" type="button">Copy Markdown</button>
                    <button id="exportHistoryBtn" class="btn-primary" type="button">Export Markdown</button>
                </div>
            </div>
        </div>

        <div id="liveView" class="view">
        <!-- Teleprompter Display Box -->
        <main class="hud-body">
            <div id="modelStatus" class="model-status">
                <span id="providerTag">Groq Cloud (gpt-oss-20b)</span>
                <span id="latencyTag">~150ms</span>
            </div>
            
            <div id="responseOutput" class="response-output">
                <p class="placeholder-text">Waiting for interviewer question... Type below or speak.</p>
            </div>
        </main>

        <!-- Quick Query Input -->
        <footer class="hud-footer">
            <button id="attachImageBtn" class="btn-sm attach-button" type="button" title="PNG, JPG, or WEBP up to 4 MB">🖼️ Screenshot</button>
            <input type="text" id="queryInput" placeholder="Ask question / past question (Press Enter)..." />
            <select id="forcedProviderSelect" class="provider-picker">
                <option value="">⚡ Auto Router</option>
                <option value="groq">Groq (gpt-oss-20b)</option>
            </select>
        </footer>
        <div id="imageAttachment" class="image-attachment hidden" aria-live="polite">
            <span id="imageAttachmentName"></span>
            <button id="clearImageBtn" type="button" aria-label="Remove screenshot attachment">×</button>
        </div>
        </div>

        <!-- Practice mode: mock interview rehearsal -->
        <section id="practiceView" class="view practice-view hidden">
            <div class="practice-row">
                <select id="practiceRole" aria-label="Role">
                    <option value="mle">ML / AI Engineer</option>
                    <option value="backend">Backend Systems</option>
                    <option value="ds">Data Scientist</option>
                </select>
                <select id="practiceTopic" aria-label="Topic">
                    <option value="stats">Stats</option>
                    <option value="ml">ML</option>
                    <option value="llm">LLM</option>
                    <option value="behavioral">Behavioral</option>
                </select>
                <button id="practiceNextBtn" class="btn-sm" type="button">New question</button>
                <span id="practiceTimer" class="practice-timer">0:00 / 2:00</span>
            </div>

            <p id="practiceQuestion" class="practice-question"></p>
            <div class="practice-row">
                <button id="practiceSpeakBtn" class="btn-sm" type="button">Speak question</button>
                <button id="practiceRecordBtn" class="btn-sm" type="button">Hold to record</button>
                <span id="practiceMicLive" class="mic-live hidden">Mic live</span>
            </div>

            <textarea id="practiceAnswer" class="practice-answer" placeholder="Type your answer, or hold the record button and speak..."></textarea>
            <p id="practiceMessage" class="practice-message hidden" role="alert"></p>
            <div class="practice-row">
                <button id="practiceFeedbackBtn" class="btn-primary" type="button">Get feedback</button>
            </div>

            <div id="practiceFeedback" class="practice-feedback hidden"></div>
            <button id="practiceFollowUpBtn" class="btn-sm hidden" type="button">Ask the follow-up</button>

            <div id="practiceSummary" class="practice-feedback hidden"></div>
            <div class="practice-row">
                <button id="practiceCopyBtn" class="btn-sm" type="button" disabled>Copy summary as Markdown</button>
            </div>
        </section>
    </div>

    <script src="../practice/questions.js"></script>
    <script src="../practice/select.js"></script>
    <script src="../practice/summary.js"></script>
    <script src="../practice/recorder.js"></script>
    <script src="practice.js"></script>
    <script src="app.js"></script>
</body>
</html>
