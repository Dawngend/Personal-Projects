name: ${COMPOSE_PROJECT_NAME:-andyhub-staging}

x-api-environment: &api-environment
  ANDYHUB_ENVIRONMENT: staging
  ANDYHUB_DATA_ROOT: /data
  ANDYHUB_DATABASE_PATH: /data/Database/reviewer.db
  ANDYHUB_UPLOADS_DIRECTORY: /data/uploads
  ANDYHUB_EXTRACTION_CACHE_DIR: /data/extraction_cache
  ANDYHUB_COURSE_MEMORY_DIRECTORY: /data/course_brain_db
  GROQ_API_KEY_FILE: /run/secrets/groq_api_key

x-api-volumes: &api-volumes
  - ./.staging/data/Database:/data/Database
  - ./.staging/data/uploads:/data/uploads
  - ./.staging/data/extraction_cache:/data/extraction_cache
  - ./.staging/data/course_brain_db:/data/course_brain_db

services:
  api:
    image: andyhub-api:${ANDYHUB_IMAGE_TAG:-phase5-rehearsal}
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      <<: *api-environment
      ANDYHUB_START_GENERATION_WORKER: "false"
      ANDYHUB_INITIALIZE_COURSE_MEMORY: "true"
    secrets:
      - groq_api_key
    volumes: *api-volumes
    networks: [staging]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 180s

  worker:
    image: andyhub-api:${ANDYHUB_IMAGE_TAG:-phase5-rehearsal}
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["python", "-m", "andyhub_api.worker"]
    environment:
      <<: *api-environment
      ANDYHUB_START_GENERATION_WORKER: "true"
      ANDYHUB_WORKER_HEALTH_PORT: "8001"
    secrets:
      - groq_api_key
    volumes: *api-volumes
    networks: [staging]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 20s

  web:
    image: andyhub-web:${ANDYHUB_IMAGE_TAG:-phase5-rehearsal}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      ANDYHUB_ENVIRONMENT: staging
      ANDYHUB_API_ORIGIN: http://api:8000
    networks: [staging]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 20s

  proxy:
    image: nginx:1.27.4-alpine
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./deploy/staging/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${STAGING_PORT:-8081}:8080"
    networks: [staging]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/proxy-health"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 10s

  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2025.2.1}
    profiles: ["tunnel"]
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      - ${STAGING_TUNNEL_CONFIG:-./deploy/staging/cloudflared/config.yml}:/etc/cloudflared/config.yml:ro
      - ${STAGING_TUNNEL_CREDENTIALS:-./deploy/staging/cloudflared/credentials.json}:/etc/cloudflared/credentials.json:ro
    networks: [staging]
    restart: unless-stopped

  smoke:
    image: andyhub-api:${ANDYHUB_IMAGE_TAG:-phase5-rehearsal}
    profiles: ["smoke"]
    # Run as a module, not a file path. Invoking the file puts
    # /app/deploy/staging on sys.path instead of /app, so smoke.py cannot
    # import extractor or grading from the repository root. The __init__.py
    # files under deploy/ exist to make this module form work.
    command: ["python", "-m", "deploy.staging.smoke"]
    environment:
      SMOKE_BASE_URL: http://proxy:8080
      WORKER_HEALTH_URL: http://worker:8001/health
      ANDYHUB_EXTRACTION_CACHE_DIR: /tmp/andyhub-smoke-cache
    depends_on:
      proxy:
        condition: service_healthy
    networks: [staging]

networks:
  staging:
    name: andyhub-staging

secrets:
  groq_api_key:
    file: ${STAGING_GROQ_SECRET_FILE:-./deploy/staging/secrets/groq_api_key}
