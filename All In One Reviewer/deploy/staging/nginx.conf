worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map $http_x_request_id $andyhub_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    log_format structured escape=json
        '{"timestamp":"$time_iso8601","level":"info","service":"proxy",'
        '"event":"http_request_completed","request_id":"$andyhub_request_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_seconds":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout structured;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream andyhub_api {
        server api:8000;
        keepalive 16;
    }

    upstream andyhub_web {
        server web:3000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 25m;

        location = /proxy-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"proxy"}';
        }

        location ^~ /api/v1/ {
            proxy_pass http://andyhub_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $andyhub_request_id;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location ~ ^/(docs|redoc|openapi\.json)(/.*)?$ {
            proxy_pass http://andyhub_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $andyhub_request_id;
        }

        location / {
            proxy_pass http://andyhub_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $andyhub_request_id;
            proxy_buffering off;
        }
    }
}
