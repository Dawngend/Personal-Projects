worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map $http_x_request_id $andyhub_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    log_format structured escape=json
        '{"timestamp":"$time_iso8601","level":"info","service":"proxy",'
        '"event":"http_request_completed","request_id":"$andyhub_request_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_seconds":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout structured;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's embedded DNS. Required because nginx resolves an upstream
    # hostname once at configuration load and then caches that address for the
    # lifetime of the process. When a container is recreated it comes back on a
    # new address, and nginx keeps talking to the old one, returning 502 for
    # every request while every container still reports healthy. With
    # restart: unless-stopped, a single OOM kill of the api container would
    # therefore take the site down permanently until someone noticed and
    # restarted the proxy by hand.
    #
    # Named upstream blocks cannot re-resolve in open-source nginx, so the
    # backends are addressed through variables instead: a variable in
    # proxy_pass makes nginx resolve the name per request, honouring the TTL
    # below. The cost is losing upstream keepalive, which is a fair trade for
    # not silently serving 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 25m;

        location = /proxy-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"proxy"}';
        }

        location ^~ /api/v1/ {
            set $andyhub_api "api:8000";
            proxy_pass http://$andyhub_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $andyhub_request_id;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location ~ ^/(docs|redoc|openapi\.json)(/.*)?$ {
            set $andyhub_api_docs "api:8000";
            proxy_pass http://$andyhub_api_docs$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $andyhub_request_id;
        }

        location / {
            set $andyhub_web "web:3000";
            proxy_pass http://$andyhub_web$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $andyhub_request_id;
            proxy_buffering off;
        }
    }
}
